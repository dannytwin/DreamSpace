<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DreamSpace - Tasks</title>

    <link rel="stylesheet" href="css/project1.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h2>DreamSpace</h2>

            <nav>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <a href="tasks.html" class="active">
                    <i class="fa-solid fa-square-check"></i>
                    <span>Tasks</span>
                </a>

                <a href="progress.html">
                    <i class="fa-solid fa-chart-simple"></i>
                    <span>Progress</span>
                </a>

                <a href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <header class="topbar">

                <input type="search" placeholder="Search tasks...">

                <div class="account">
                    <span><i class="fa-regular fa-bell notification"></i></span>
                    <span class="d">D</span>
                </div>

            </header>


            <!-- TASKS PAGE -->
            <section class="tasks-content">

                <h1>My Tasks</h1>
                <p>Organise your work and stay productive.</p>

                <form class="task-create" id="task-form">
                    <label class="sr-only" for="task-title">New task</label>
                    <input id="task-title" type="text" placeholder="Add a new task..." maxlength="80" required>

                    <label class="sr-only" for="task-category">Task category</label>
                    <select id="task-category">
                        <option>Web development</option>
                        <option>Personal development</option>
                        <option>Design</option>
                    </select>

                    <button type="submit">Add task <span aria-hidden="true">+</span></button>
                </form>

                <!-- TASK FILTERS -->
                <div class="task-filters">

           
                </div>


                <!-- TASK LIST -->
                <div class="task-list">

              

                </div>

            </section>

        </main>

    </div>

    <script src="scripts/storage.js"></script>
    <script src="scripts/tasks.js"></script>
</body>
</html>
