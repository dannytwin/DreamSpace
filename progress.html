<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamSpace | Progress</title>

    <link rel="stylesheet" href="css/project1.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h2>DreamSpace</h2>

            <nav>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <a href="tasks.html">
                    <i class="fa-solid fa-square-check"></i>
                    <span>Tasks</span>
                </a>

                <a href="progress.html" class="active">
                    <i class="fa-solid fa-chart-simple"></i>
                    <span>Progress</span>
                </a>

                <a href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- TOPBAR -->
            <header class="topbar">

                <input type="search" placeholder="Search anything...">

                <div class="account">
                    <span><i class="fa-regular fa-bell notification"></i></span>
                    <span class="d">D</span>
                </div>

            </header>


            <!-- PROGRESS CONTENT -->
            <section class="progress-content">

                <h1>My Progress</h1>
                <p>Keep track of your learning journey.</p>


                <!-- STATISTICS -->
                <div class="stats-grid">

                    <div class="stat-card">
                        <i class="fa-solid fa-book-open"></i>
                        <h3>Courses</h3>
                        <h2>04</h2>
                        <p>Courses in progress</p>
                    </div>

                    <div class="stat-card">
                        <i class="fa-solid fa-circle-check"></i>
                        <h3>Tasks</h3>
                        <h2>18</h2>
                        <p>Tasks completed</p>
                    </div>

                    <div class="stat-card">
                        <i class="fa-solid fa-clock"></i>
                        <h3>Study Time</h3>
                        <h2>12 hrs</h2>
                        <p>Total learning time</p>
                    </div>

                </div>


                <!-- COURSE PROGRESS -->
                <div class="course-progress">

                    <h2>Course Progress</h2>


                    <div class="progress-item">

                        <div class="progress-info">
                            <h3>Web Development</h3>
                            <span>65%</span>
                        </div>

                        <progress value="65" max="100"></progress>

                    </div>


                    <div class="progress-item">

                        <div class="progress-info">
                            <h3>UI/UX Design</h3>
                            <span>40%</span>
                        </div>

                        <progress value="40" max="100"></progress>

                    </div>


                    <div class="progress-item">

                        <div class="progress-info">
                            <h3>JavaScript</h3>
                            <span>80%</span>
                        </div>

                        <progress value="80" max="100"></progress>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="scripts/storage.js"></script>
    <script src="scripts/progress.js"></script>
</body>
</html>
