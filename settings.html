<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DreamSpace - Settings</title>

    <link rel="stylesheet" href="css/project1.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h2>DreamSpace</h2>

            <nav>
                <a href="project1.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <a href="tasks.html">
                    <i class="fa-solid fa-square-check"></i>
                    <span>Tasks</span>
                </a>

                <a href="progress.html">
                    <i class="fa-solid fa-chart-simple"></i>
                    <span>Progress</span>
                </a>

                <a href="settings.html" class="active">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <header class="topbar">

                <input type="search" placeholder="Search settings...">

                <div class="account">
                    <span><i class="fa-regular fa-bell notification"></i></span>
                    <span class="d">D</span>
                </div>

            </header>


            <!-- SETTINGS CONTENT -->
            <section class="settings-content">

                <h1>Settings</h1>

                <p>Manage your preferences.</p>


                <!-- ACCOUNT SETTINGS -->
                <div class="settings-card">

                    <h2>
                        <i class="fa-solid fa-user"></i>
                        Account
                    </h2>

                    <div class="setting-item">
                        <label>Username</label>
                        <input type="text" value="DreamUser">
                    </div>

                    <div class="setting-item">
                        <label>Email Address</label>
                        <input type="email" value="dream@example.com">
                    </div>

                </div>


                <!-- APPEARANCE SETTINGS -->
                <div class="settings-card">

                    <h2>
                        <i class="fa-solid fa-palette"></i>
                        Appearance
                    </h2>

                    <div class="setting-item">
                        <label>Theme</label>

                        <select>
                            <option>Light Mode</option>
                            <option>Dark Mode</option>
                        </select>
                    </div>

                </div>


                <!-- NOTIFICATION SETTINGS -->
                <div class="settings-card">

                    <h2>
                        <i class="fa-solid fa-bell"></i>
                        Notifications
                    </h2>

                    <div class="setting-item notification-setting">
                        <label>Enable Notifications</label>
                        <input type="checkbox" checked>
                    </div>

                </div>


                <button class="save-button">
                    Save Changes
                </button>

            </section>

        </main>

    </div>

    <script src="scripts/storage.js"></script>
    <script src="scripts/settings.js"></script>
</body>
</html>
